name: personal build

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: Treat this dispatch as the daily scheduled run (skip build when base is unchanged)
        type: boolean
        default: false
      attempt:
        description: Retry counter for runner-capacity failures (capped by the retry job)
        type: number
        default: 0
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    # Non-final attempts neutralize failures (run shows a warning, not red X);
    # the final attempt (2) records real failures for the notify job.
    continue-on-error: ${{ (inputs.attempt || 0) < 2 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: sync with latest stable release and rebuild patches
        id: sync
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main --tags --no-recurse-submodules
          BASE=$(git ls-remote --tags upstream 'v*' \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "basing on $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # Invariant: main is exactly <release tag> + one squashed patch
          # commit. Upstream tags live on independent release lines, so a
          # plain rebase would replay the old tag's bookkeeping commits too
          # and conflict on the version bumps; --onto replays only our
          # patch commit onto the new base.
          git rev-parse --verify HEAD~1 >/dev/null || { echo "main must be base + 1 commit"; exit 1; }
          git log -1 --format=%s HEAD | grep -q "^personal: Zed-wrap" || { echo "HEAD is not the patch commit"; exit 1; }
          git branch pre-rebase
          git rebase --onto "$BASE" HEAD~1
          # GITHUB_TOKEN is a GitHub App token and can never push workflow
          # file updates, so mirror the fork's workflows from before the
          # rebase. Restore alone is not enough: workflow files newly added
          # upstream survive `checkout`, leaving a workflow diff that rejects
          # the push — remove the directory first, then restore.
          git rm -rq .github/workflows
          git checkout "$(git rev-parse pre-rebase)" -- .github/workflows
          git commit --amend --no-edit --quiet
          git push --force-with-lease origin main

          # Scheduled runs and relayed dispatches (scheduled=true) skip when
          # the latest release already covers this base; manual runs always
          # build.
          if { [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ inputs.scheduled }}" = "true" ]; } \
            && gh release view --repo kbilkis/zed-WITH-TAB-WRAPPING --json body --jq .body \
            | grep -qF "Base: $BASE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no new stable release since $BASE; skipping build"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: free disk space
        if: steps.sync.outputs.skip != 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /Users/runner/Library/Android \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            /usr/local/share/boost \
            /usr/local/julia* \
            /usr/local/miniconda \
            /usr/local/share/miniconda \
            /usr/local/ghcup \
            "$HOME/.dotnet" \
            /usr/local/share/powershell \
            /Applications/Firefox.app \
            "/Applications/Google Chrome.app" \
            || true
          df -h / | tail -1

      - uses: Swatinem/rust-cache@v2
        if: steps.sync.outputs.skip != 'true'
        with:
          cache-on-failure: true

      - name: compute release version
        if: steps.sync.outputs.skip != 'true'
        run: |
          TAG="v1.$(date +%Y%m%d).${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ZED_APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "release $TAG (app version ${TAG#v})"

      # macos-15 image: default Xcode 16.4 (SDK 15) fails bundle-mac's SDK 26
      # check; 26.3 ships side-by-side. macos-26 image also works but rarely
      # acquires a runner on the free tier.
      - name: select Xcode 26
        if: steps.sync.outputs.skip != 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: build
        if: steps.sync.outputs.skip != 'true'
        env:
          ZED_APP_VERSION: ${{ env.ZED_APP_VERSION }}
          # "limited" debug info balloons target/ past what a stock macOS
          # runner disk fits; a personal build doesn't need it.
          CARGO_PROFILE_RELEASE_DEBUG: none
        run: |
          # option_env! is not a cargo fingerprint input; force the crate
          # holding the baked version to recompile.
          touch crates/release_channel/src/lib.rs
          ./script/bundle-mac

      - name: release
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo kbilkis/zed-WITH-TAB-WRAPPING \
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg \
            --title "Zed-wrap $TAG" --latest \
            --notes "Zed-wrap build. Base: ${{ steps.sync.outputs.base }}. Tab wrapping (tab_bar.wrap_tabs) + GitHub auto-update."

      - uses: actions/upload-artifact@v4
        if: steps.sync.outputs.skip != 'true'
        with:
          name: Zed-dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg

  # GitHub-hosted macOS arm64 runners hit capacity shortages; a failed or
  # cancelled build (never acquired a runner) re-dispatches after a cooldown.
  # Uses needs.build.result (actual outcome) because success() is always true
  # once continue-on-error neutralizes the build job on non-final attempts.
  retry:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'success' && (inputs.attempt || 0) < 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: re-dispatch after cooldown
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || 0 }}
        run: |
          sleep 900
          gh workflow run personal-build.yml \
            --repo kbilkis/zed-WITH-TAB-WRAPPING \
            --ref main \
            -f scheduled=true \
            -f attempt=$((ATTEMPT + 1))

  # All attempts exhausted: open (or comment on) a tracking issue. Creating an
  # issue emails the repo owner via normal GitHub notifications.
  notify:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'success' && (inputs.attempt || 0) >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "in:title is:open Zed-wrap build failed" \
            --json number --jq '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "Final build attempt failed: $RUN_URL"
          else
            gh issue create --title "Zed-wrap build failed" \
              --body "Final build attempt failed: $RUN_URL"
          fi
